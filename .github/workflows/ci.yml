name: CI

on:
  push:
    branches: [development, main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tapwear
          POSTGRES_PASSWORD: tapwear_password
          POSTGRES_DB: tapwear_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tapwear -d tapwear_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      # The tests create and use a separate "tapwear_test" database on this server.
      # Tests that need object storage skip themselves when it is not running.
      DATABASE_URL: postgresql+asyncpg://tapwear:tapwear_password@localhost:5432/tapwear_db
      MINIO_ACCESS_KEY: unused
      MINIO_SECRET_KEY: unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
