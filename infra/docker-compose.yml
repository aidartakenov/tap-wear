# Named "tapwear-dev" so its volumes cannot collide with another local project called "tapwear".
name: tapwear-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tapwear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tapwear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tapwear_password}
      POSTGRES_DB: ${POSTGRES_DB:-tapwear_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first boot of an empty volume: enables the pgvector extension.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # MinIO stopped publishing its own images; this is the same server packaged by Chainguard.
    image: cgr.dev/chainguard/minio:latest
    container_name: tapwear-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
